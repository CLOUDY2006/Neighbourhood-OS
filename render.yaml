services:
  - type: web
    name: neighborhood-os
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TINYFISH_COUNTRY
        value: IN
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: PLATFORM_ADMINS
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false